
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLAW BOT | Command Center by Karren Tonoyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains+Mono', monospace;
            background-color: #020202;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.1);
        }
        .claw-gradient {
            background: linear-gradient(135deg, #00f2ff 0%, #0066ff 100%);
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 242, 255, 0.05) 0%, rgba(255, 255, 255, 0) 10%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scan 8s linear infinite;
        }
        @keyframes scan {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
        .glow-hover:hover {
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }
    </style>
